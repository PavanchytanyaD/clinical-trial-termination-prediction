# Paste this "mitigation:" block into configs/bias_config.yaml once
# danush/bias-slicing is merged. Until then, run with:
#   python -m src.bias.run_bias_mitigation --config configs/bias_mitigation_section.yaml
mitigation:
  input_path: data/bias/data_slices.csv   # TODO: match Danush's output path and file name
  output_dir: data/bias/mitigation
  id_column: nct_id
  label_column: label                     # TODO: check the label column name in his CSV
  multi_value_sep: "|"                    # therapeutic_area / region values like "a|b"
  slices:                                 # same 8 slices as bias detection
    - phase
    - study_type
    - sponsor_class
    - gender
    - therapeutic_area
    - age_group
    - region
    - start_era
  skip_groups: [UNKNOWN]                  # never boost the "missing value" group
  method: reweight                        # reweight or resample
  min_share: 0.01                         # same 1% rule as detection's too_small flag
  max_weight: 10.0                        # no trial counts more than 10x
  random_seed: 42                         # for resample, so runs are reproducible