# Airflow for the data pipeline on the Compute Engine VM (LocalExecutor on
# Postgres). gce/vm.sh creates the VM, writes .env from .env.example and runs
#
#   docker compose up -d --build
#
# The repository checkout is mounted read-only at /opt/ctt: the DAG comes from
# there, and every task copies the code to a fresh folder (gce/run_task.sh),
# so tasks are isolated as in a Composer pod. Data goes to the DVC remote and
# the run state to GCS, using the VM's service account (pipeline-sa).

x-airflow: &airflow
  build:
    context: ../../..
    dockerfile: Data-Pipeline/gce/airflow/Dockerfile
  image: ctt-data-pipeline-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - path: ../../.env        # pipeline secrets: AACT_*, SMTP_*, ALERT_*
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/ctt/Data-Pipeline/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    CTT_ALERT_EMAILS: ${CTT_ALERT_EMAILS:-}
    CTT_SOURCE: ${CTT_SOURCE:-sample}
    CTT_ZIP: ${CTT_ZIP:-}
  volumes:
    - ../../..:/opt/ctt:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    # the image's entrypoint registers AIRFLOW_UID as a user, which Airflow
    # needs; the admin user may already exist on later starts
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        { airflow users create --role Admin --username admin \
            --firstname Admin --lastname User --email admin@example.com \
            --password "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}" \
          || airflow users list | grep -q admin; }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    restart: "no"

  scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  webserver:
    <<: *airflow
    command: webserver
    # bound to the VM's localhost; reach it through ./gce/vm.sh ui
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
